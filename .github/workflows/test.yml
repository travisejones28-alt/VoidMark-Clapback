name: Test Clapback
on: [push, pull_request, workflow_dispatch]
jobs:
  companion:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
      - name: Parse PowerShell
        shell: pwsh
        run: |
          Get-ChildItem companion/*.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { throw ($errors | Out-String) }
          }
      - name: Package release candidate
        shell: pwsh
        run: |
          Compress-Archive -Path VoidMarkClapback -DestinationPath VoidMarkClapback-Addon.zip
          Compress-Archive -Path companion,Start-Clapback.cmd,package.json,README.md -DestinationPath VoidMarkClapback-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: VoidMark-Clapback-0.1.0
          path: '*.zip'
  addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - run: lua5.1 tests/addon.lua
